<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <script src="main.js" defer></script>
        <title>Pokedex</title>
    </head>

    <body>

        <main class="main"> 

            <header class="header-home">

                <div class="container">

                    <div class="logo-wrapper">  
                        <img src="Assets/pokeball.webp" 
                        alt="Pokemonball" 
                        class="logo"/>
                        <h1>Pokedex</h1>
                    </div>

                    <div class="search-wrapper">
                        <div class="search-wrap">
                            <img src="Assets/search.png" 
                            alt="Search Icon" 
                            class="search-icon"/>

                            <input type="text" 
                            id="search-input"
                            placeholder="Search"
                            class="search-input body3-fonts"/>

                            <img src="Assets/cross.png"
                            id="search-close-icon" 
                            alt="Cross Icon" 
                            class="search-close-icon"/>
                        </div>

                        <div class="sort-wrapper">
                            <div class="sort-wrap">
                                <img src="Assets/sort.png"
                                id="sort-icon" 
                                alt="Sort Icon" 
                                class="sort-icon"/>
                            </div>
                            <div class="filter-wrapper">
                                <p class="body2-fonts">Sort by:</p>
                                <div class="filter-wrap">
                                    <div>
                                        <input 
                                        type="radio" 
                                        id="number" 
                                        name="filters" 
                                        value="number" 
                                        checked/>

                                        <label for="number" class="body3-fonts">Number</label>
                                    </div>
                                    <div>
                                        <input 
                                        type="radio" 
                                        id="name" 
                                        name="filters" 
                                        value="name"/>

                                        <label for="name" class="body3-fonts">Name</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </header>

            <section class="pokemon-list">

                <div class="container">
                    <div class="list-wrapper"></div>
                </div>

                <div id="not-found-message">Pokemon not found</div>

            </section>

        </main>

    </body>

</html>
